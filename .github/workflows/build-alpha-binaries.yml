name: Build and publish immutable alpha

on:
  push:
    tags:
      - "v*-alpha.*"
    # One version-bound develop commit can publish alpha.4; tag pushes ignore path filters.
    branches:
      - develop
    paths:
      - ".github/release-intents/v0.1.0-alpha.4"

permissions:
  contents: read

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable source and release intent
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and reject existing release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            intent="$(cat .github/release-intents/v0.1.0-alpha.4)"
            test "$intent" = "0.1.0-alpha.4"
            tag="v$intent"
          else
            tag="$GITHUB_REF_NAME"
            [[ "$GITHUB_REF" == "refs/tags/$tag" ]]
          fi
          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-alpha[.][0-9]+$ ]]; then
            echo "Expected a new tag such as v0.1.0-alpha.4" >&2
            exit 1
          fi
          # gh api /git/ref can return a non-empty 'null' sentinel for a
          # non-existent ref. Match the full tag ref using git, not a prefix.
          remote_sha="$(git ls-remote --refs origin "refs/tags/$tag" | awk -v ref="refs/tags/$tag" '$2 == ref {print $1}')"
          if [[ "$GITHUB_REF" != "refs/heads/develop" && -z "$remote_sha" ]]; then
            echo "Tagged release must have an existing immutable source tag." >&2
            exit 1
          fi
          if [[ -n "$remote_sha" && "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag moved or is annotated; release tags must be lightweight and unmodified." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Create a NEW version instead of overwriting it." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  native-macos-settings:
    name: Compile AppKit settings window (arm64)
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile project-owned AppKit plugin (no new dependency)
        run: bash tools/build-native-settings-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vcr-settings-appkit
          path: |
            unity/Assets/Plugins/macOS/VcrSettingsWindow.dylib
            unity/Assets/Plugins/macOS/VcrSettingsWindow.dylib.meta
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.name }}
    needs: [preflight, native-macos-settings]
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (IL2CPP, non-Development)
            runsOn: windows-2022
            target: StandaloneWindows64
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildWindowsReleaseCandidateFromMenu
            folder: Windows
            suffix: Windows-x64
            image: unityci/editor:windows-6000.3.25f1-windows-il2cpp-3
          - name: macOS (Mono)
            runsOn: ubuntu-latest
            target: StandaloneOSX
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildMacFromMenu
            folder: macOS
            suffix: macOS
            image: unityci/editor:6000.3.25f1-mac-mono-3
    env:
      VCR_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source SHA and prepare Windows worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          test ! -e unity/Library
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # A CRLF checkout would break the bash bootstrap scripts.
            find tools -maxdepth 1 -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'
            command -v git
            command -v curl
            command -v tar
            command -v sha256sum
          fi
      - name: Use pinned Python runtime on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provide python3 alias required by Windows bootstrap scripts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/vcr-shims"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/python3" <<'EOF'
          #!/usr/bin/env bash
          exec python "$@"
          EOF
          chmod +x "$shim_dir/python3"
          printf '%s\n' "$(cygpath -w "$shim_dir")" >> "$GITHUB_PATH"
          "$shim_dir/python3" --version
      - name: Bind version for Unity runner, even when container env is filtered
        shell: bash
        run: |
          mkdir -p Builds/Alpha
          printf '%s\n' "$VCR_RELEASE_VERSION" > Builds/Alpha/release-version.txt
      - name: Bootstrap pinned MediaPipe package and models
        shell: bash
        run: bash ./tools/bootstrap-mediapipe.sh
      - name: Bootstrap pinned Pretendard UI font
        shell: bash
        run: bash ./tools/bootstrap-ui-fonts.sh
      - name: Bootstrap pinned Ultraleap Unity 6 compatibility
        shell: bash
        run: bash ./tools/bootstrap-ultraleap.sh
      - name: Bootstrap pinned UniWinC native teardown compatibility
        shell: bash
        run: bash ./tools/bootstrap-uniwinc.sh
      - name: Download compiled AppKit settings host
        uses: actions/download-artifact@v4
        with:
          name: vcr-settings-appkit
          path: unity/Assets/Plugins/macOS/
      - name: Ensure Windows Docker daemon is ready
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $maxRetries = 10
          $retryDelay = 6
          for ($i = 0; $i -lt $maxRetries; $i++) {
            $svc = Get-Service docker -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') {
              docker version 2>$null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Docker is ready."
                exit 0
              }
            }
            if ($svc -and $svc.Status -eq 'Stopped') {
              Write-Host "Docker service stopped, attempting to start..."
              Start-Service docker -ErrorAction SilentlyContinue
            }
            Write-Host "Waiting for Docker daemon (attempt $($i+1)/$maxRetries)..."
            Start-Sleep -Seconds $retryDelay
          }
          Write-Error "Docker daemon did not start within $($maxRetries * $retryDelay) seconds"
          exit 1
      - name: Pull pinned Windows IL2CPP editor image
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 25
        run: |
          $image = 'unityci/editor:windows-6000.3.25f1-windows-il2cpp-3'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Pulling $image (attempt $attempt/3)..."
            docker pull $image
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to pull $image" }
          docker image inspect $image | Out-Null
      - name: Build Unity alpha
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.method }}
          customImage: ${{ matrix.image }}
          versioning: None
          allowDirtyBuild: true
      - name: Package player with source proof and checksum
        env:
          PLAYER_FOLDER: ${{ matrix.folder }}
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PLAYER_FOLDER" == Windows ]]; then
            folder="Builds/ReleaseCandidates/$VCR_RELEASE_VERSION/$PLAYER_FOLDER"
          else
            folder="Builds/Alpha/$VCR_RELEASE_VERSION/$PLAYER_FOLDER"
          fi
          test -d "$folder"
          if [[ "$PLAYER_FOLDER" == Windows ]]; then
            test -f "$folder/VirtualCharacterRender.exe"
            # The Windows alpha must be an IL2CPP player, not a Mono fallback.
            test -f "$folder/GameAssembly.dll"
            test -f "$folder/UnityPlayer.dll"
            test -f "$folder/VirtualCharacterRender_Data/il2cpp_data/Metadata/global-metadata.dat"
            test ! -d "$folder/MonoBleedingEdge"
          else
            test -d "$folder/VirtualCharacterRender.app"
          fi
          mkdir -p release-assets
          package="VirtualCharacterRender-$VCR_RELEASE_VERSION-$PACKAGE_SUFFIX.zip"
          target="$PWD/release-assets/$package"
          if [[ "$PLAYER_FOLDER" == Windows ]]; then
            seven_zip="$(command -v 7z || true)"
            if [[ -z "$seven_zip" && -f "/c/Program Files/7-Zip/7z.exe" ]]; then
              seven_zip="/c/Program Files/7-Zip/7z.exe"
            fi
            if [[ -n "$seven_zip" ]]; then
              (cd "$folder" && "$seven_zip" a -tzip "$target" . >/dev/null)
            else
              powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$folder")\\*' -DestinationPath '$(cygpath -w "$target")' -Force"
            fi
            {
              printf 'backend=IL2CPP\n'
              printf 'build_options=None\n'
              printf 'version=%s\n' "$VCR_RELEASE_VERSION"
              printf 'unity_version=6000.3.25f1\n'
              printf 'source_sha=%s\n' "$GITHUB_SHA"
              printf 'gameassembly_sha256=%s\n' "$(sha256sum "$folder/GameAssembly.dll" | cut -d' ' -f1)"
              printf 'gameassembly_size=%s\n' "$(stat -c%s "$folder/GameAssembly.dll")"
              printf 'unityplayer_sha256=%s\n' "$(sha256sum "$folder/UnityPlayer.dll" | cut -d' ' -f1)"
              printf 'global_metadata_sha256=%s\n' "$(sha256sum "$folder/VirtualCharacterRender_Data/il2cpp_data/Metadata/global-metadata.dat" | cut -d' ' -f1)"
            } > release-assets/il2cpp-evidence.txt
          else
            (cd "$folder" && zip -r -y "$target" .)
          fi
          test -s "$target"
          (cd release-assets && sha256sum "$package" > "$package.sha256")
          printf '%s\n' "$GITHUB_SHA" > "release-assets/$package.source-sha"
          cat "release-assets/$package.sha256"
      - name: Execute native Windows IL2CPP Player
        if: runner.os == 'Windows'
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euo pipefail
          package="VirtualCharacterRender-$VCR_RELEASE_VERSION-$PACKAGE_SUFFIX.zip"
          python tools/run-player-smoke.py \
            --platform windows \
            --archive "release-assets/$package" \
            --source "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/Builds/PlayerSmoke/windows"
          cp Builds/PlayerSmoke/windows/player-smoke.json release-assets/windows-il2cpp-smoke.json
          cp Builds/PlayerSmoke/windows/runner-evidence.json release-assets/windows-il2cpp-runner-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-${{ matrix.suffix }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish once after both builds
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate immutable source, both archives and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            test "$GITHUB_REF" = "refs/tags/$tag"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          else
            test "$VERSION" = "0.1.0-alpha.4"
            test "$(cat .github/release-intents/v0.1.0-alpha.4)" = "$VERSION"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing release: $tag" >&2
            exit 1
          fi
          for suffix in Windows-x64 macOS; do
            package="VirtualCharacterRender-$VERSION-$suffix.zip"
            test -s "release-assets/$package"
            test "$(cat "release-assets/$package.source-sha")" = "$GITHUB_SHA"
            (cd release-assets && sha256sum --check "$package.sha256")
          done
          test -s release-assets/windows-il2cpp-smoke.json
          test -s release-assets/windows-il2cpp-runner-evidence.json
          test -s release-assets/il2cpp-evidence.txt
          python3 tools/verify-windows-il2cpp-release.py \
            --smoke release-assets/windows-il2cpp-smoke.json \
            --runner release-assets/windows-il2cpp-runner-evidence.json \
            --evidence release-assets/il2cpp-evidence.txt \
            --archive "release-assets/VirtualCharacterRender-$VERSION-Windows-x64.zip" \
            --source "$GITHUB_SHA" \
            --version "$VERSION"
      - name: Create immutable alpha tag after both builds passed
        if: ${{ github.ref == 'refs/heads/develop' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = "0.1.0-alpha.4"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag="v$VERSION"
          remote_sha="$(git ls-remote --refs origin "refs/tags/$tag" | awk -v ref="refs/tags/$tag" '$2 == ref {print $1}')"
          if [[ -n "$remote_sha" ]]; then
            test "$remote_sha" = "$GITHUB_SHA"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Publish immutable prerelease with provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          windows="VirtualCharacterRender-$VERSION-Windows-x64.zip"
          mac="VirtualCharacterRender-$VERSION-macOS.zip"
          (cd release-assets && sha256sum "$windows" "$mac" \
            windows-il2cpp-smoke.json windows-il2cpp-runner-evidence.json \
            il2cpp-evidence.txt > SHA256SUMS.txt)
          jq -n \
            --arg tag "$tag" \
            --arg sha "$GITHUB_SHA" \
            --arg unity "6000.3.25f1" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg windows "$windows" \
            --arg windows_sha "$(sha256sum "release-assets/$windows" | cut -d' ' -f1)" \
            --arg windows_backend "IL2CPP" \
            --arg windows_smoke_sha "$(sha256sum "release-assets/windows-il2cpp-smoke.json" | cut -d' ' -f1)" \
            --arg mac "$mac" \
            --arg mac_sha "$(sha256sum "release-assets/$mac" | cut -d' ' -f1)" \
            '{tag:$tag,source_sha:$sha,unity_version:$unity,workflow_run:$workflow,windows_backend:$windows_backend,assets:[{name:$windows,sha256:$windows_sha},{name:$mac,sha256:$mac_sha}],windows_smoke:{asset:"windows-il2cpp-smoke.json",sha256:$windows_smoke_sha,passed:true}}' \
            > release-assets/build-provenance.json
          cat > release-notes.md <<EOF
          ## VirtualCharacterRender $VERSION

          Integrated desktop alpha for Windows x64 (IL2CPP, non-Development) and macOS (Mono) (Unity 6000.3.25f1).

          - Immutable source tag: \`$tag\`
          - Source commit: [\`$GITHUB_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - Build workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Checksums: \`SHA256SUMS.txt\`
          - Machine-readable source-to-artifact mapping: \`build-provenance.json\`

          ### Run (Unity is not required)

          - Windows x64: extract the Windows IL2CPP ZIP and double-click \`VirtualCharacterRender.exe\`.
          - Apple Silicon macOS: extract the macOS ZIP and open \`VirtualCharacterRender.app\`. If macOS blocks an unsigned app, review it under System Settings > Privacy & Security.
          - You can launch without a VRM model, camera or OBS; enable those features separately after startup.

          ### Build and runtime evidence

          - Windows x64 backend: \`IL2CPP\` (non-Development; GameAssembly.dll and il2cpp_data included; no MonoBleedingEdge).
          - The Windows IL2CPP Player passed a native startup/shutdown smoke before publication.
          - Evidence assets: \`windows-il2cpp-smoke.json\`, \`windows-il2cpp-runner-evidence.json\`, \`il2cpp-evidence.txt\`.
          - This release demonstrates build/package success and Windows IL2CPP startup/shutdown. It does not prove physical tracking, OBS, camera, Ultraleap, or performance validation. See \`docs/ALPHA_TESTING.md\`.
          EOF
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            "release-assets/$windows" "release-assets/$mac" \
            release-assets/SHA256SUMS.txt release-assets/build-provenance.json \
            release-assets/il2cpp-evidence.txt \
            release-assets/windows-il2cpp-smoke.json \
            release-assets/windows-il2cpp-runner-evidence.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VirtualCharacterRender $VERSION" \
            --notes-file release-notes.md --prerelease
      - name: Verify published assets and release target
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          for file in "VirtualCharacterRender-$VERSION-Windows-x64.zip" "VirtualCharacterRender-$VERSION-macOS.zip" SHA256SUMS.txt build-provenance.json il2cpp-evidence.txt windows-il2cpp-smoke.json windows-il2cpp-runner-evidence.json; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx -- "$file"
          done
