name: Build alpha binaries

on:
  push:
    branches:
      - "release/0.1.0-alpha.1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-alpha-0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: StandaloneWindows64
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildWindowsFromMenu
            output_dir: Builds/Alpha/0.1.0-alpha.1/Windows
            package: VirtualCharacterRender-0.1.0-alpha.1-Windows-x64.zip
          - name: macOS
            target: StandaloneOSX
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildMacFromMenu
            output_dir: Builds/Alpha/0.1.0-alpha.1/macOS
            package: VirtualCharacterRender-0.1.0-alpha.1-macOS.zip

    steps:
      - name: Checkout alpha source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap pinned MediaPipe package and models
        shell: bash
        run: bash ./tools/bootstrap-mediapipe.sh

      - name: Build Unity alpha
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.method }}
          versioning: None
          allowDirtyBuild: true

      - name: Verify player output
        shell: bash
        run: |
          set -euo pipefail
          test -d "${{ matrix.output_dir }}"
          find "${{ matrix.output_dir }}" -maxdepth 3 -type f -print

      - name: Package player
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ matrix.package }}"
          (
            cd "${{ matrix.output_dir }}"
            zip -r -y "../../../../${{ matrix.package }}" .
          )
          test -s "${{ matrix.package }}"
          ls -lh "${{ matrix.package }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach binaries to alpha release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach binaries to v0.1.0-alpha.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-assets
          gh release upload v0.1.0-alpha.1             release-assets/VirtualCharacterRender-0.1.0-alpha.1-Windows-x64.zip             release-assets/VirtualCharacterRender-0.1.0-alpha.1-macOS.zip             --repo "${{ github.repository }}"             --clobber
