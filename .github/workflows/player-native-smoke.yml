name: Native Windows and macOS Player startup smoke

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      smoke_repeat_count:
        description: Number of native startup/shutdown runs per platform (1-10)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: native-player-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-macos-settings:
    name: Compile AppKit settings window (arm64)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile project-owned AppKit plugin (no new dependency)
        run: bash tools/build-native-settings-macos.sh
      - name: Upload native plugin and Unity importer metadata
        uses: actions/upload-artifact@v4
        with:
          name: vcr-settings-appkit
          path: |
            unity/Assets/Plugins/macOS/VcrSettingsWindow.dylib
            unity/Assets/Plugins/macOS/VcrSettingsWindow.dylib.meta
          if-no-files-found: error
          retention-days: 7

  build:
    needs: native-macos-settings
    name: Build native ${{ matrix.platform }} Player
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            unityTarget: StandaloneWindows64
            # Ubuntu-hosted CI can only cross-build a Windows Mono Player.
            # Windows IL2CPP release evidence is produced on a Windows host.
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildWindowsMonoAndExit
            outputFolder: Windows
            image: unityci/editor:6000.3.25f1-windows-mono-3
          - platform: windows-nodebug
            unityTarget: StandaloneWindows64
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildWindowsWithoutDebuggingFromMenu
            outputFolder: WindowsNoDebug
            image: unityci/editor:6000.3.25f1-windows-mono-3
          - platform: macos
            unityTarget: StandaloneOSX
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildMacFromMenu
            outputFolder: macOS
            image: unityci/editor:6000.3.25f1-mac-mono-3
          - platform: macos-nodebug
            unityTarget: StandaloneOSX
            method: VCR.Editor.Alpha.AlphaBuildMenu.BuildMacWithoutDebuggingFromMenu
            outputFolder: macOSNoDebug
            image: unityci/editor:6000.3.25f1-mac-mono-3
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact Unity source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          python3 tools/validate-unity-reproducibility.py
          python3 tools/validate-repository-structure.py --strict-reproducibility
          sha256sum unity/Packages/packages-lock.json unity/ProjectSettings/ProjectSettings.asset > "$RUNNER_TEMP/project-inputs.sha256"
          test ! -e unity/Library
          mkdir -p Builds/Alpha
          printf '%s\n' '0.0.0-alpha.0' > Builds/Alpha/release-version.txt
      - name: Bootstrap pinned MediaPipe and models
        run: bash tools/bootstrap-mediapipe.sh
      - name: Bootstrap verified Pretendard UI font
        run: bash tools/bootstrap-ui-fonts.sh
      - name: Bootstrap pinned Ultraleap compatibility
        run: bash tools/bootstrap-ultraleap.sh
      - name: Bootstrap pinned UniWinC compatibility
        run: bash tools/bootstrap-uniwinc.sh
      - name: Download compiled AppKit settings host
        uses: actions/download-artifact@v4
        with:
          name: vcr-settings-appkit
          path: unity/Assets/Plugins/macOS/
      - name: Build actual Unity standalone Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: ${{ matrix.unityTarget }}
          buildMethod: ${{ matrix.method }}
          customImage: ${{ matrix.image }}
          versioning: None
          allowDirtyBuild: true
      - name: Verify built Player and package immutable input evidence
        shell: bash
        env:
          PLAYER_PLATFORM: ${{ matrix.platform }}
          OUTPUT_FOLDER: ${{ matrix.outputFolder }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/project-inputs.sha256"
          folder="Builds/Alpha/0.0.0-alpha.0/$OUTPUT_FOLDER"
          test -d "$folder"
          if [[ "$PLAYER_PLATFORM" == windows* ]]; then
            test -s "$folder/VirtualCharacterRender.exe"
            test -d "$folder/VirtualCharacterRender_Data"
            # This Linux-hosted gate validates the supported Windows Mono
            # smoke Player. Windows IL2CPP is built and validated on Windows.
            test -d "$folder/MonoBleedingEdge"
            test ! -e "$folder/GameAssembly.dll"
          else
            test -d "$folder/VirtualCharacterRender.app/Contents/MacOS"
          fi
          mkdir -p player-artifacts
          target="$GITHUB_WORKSPACE/player-artifacts/$PLAYER_PLATFORM.zip"
          (cd "$folder" && zip -q -r -y "$target" .)
          if [[ "$PLAYER_PLATFORM" == windows* ]]; then
            # Diagnostic scripts accompany CI smoke archives, not releases.
            zip -q -j "$target" tools/start-exit-diagnostics.cmd tools/collect-exit-diagnostics.ps1 tools/start-exit-diagnostics-native.cmd tools/capture-exit-dump.ps1
          fi
          test -s "$target"
          sha256sum "$target" > "player-artifacts/$PLAYER_PLATFORM.sha256"
          printf '%s\n' "$GITHUB_SHA" > "player-artifacts/$PLAYER_PLATFORM.source-sha"
          printf '%s\n' "$PR_HEAD_SHA" > "player-artifacts/$PLAYER_PLATFORM.pr-head-sha"
      - name: Upload Player ZIP and provenance
        uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.platform }}-${{ github.sha }}
          path: player-artifacts/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Execute ${{ matrix.platform }} Player on ${{ matrix.runner }}
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: windows-nodebug
            runner: windows-latest
          - platform: macos
            runner: macos-15
          - platform: macos-nodebug
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout evidence verifier
        uses: actions/checkout@v4
      - name: Download this commit's built Player
        uses: actions/download-artifact@v4
        with:
          name: player-${{ matrix.platform }}-${{ github.sha }}
          path: player-artifacts
      - name: Use pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Launch native Player, require runtime startup and clean shutdown
        shell: bash
        env:
          PLAYER_PLATFORM: ${{ matrix.platform }}
          SMOKE_REPEAT_COUNT: ${{ github.event.inputs.smoke_repeat_count || '1' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$SMOKE_REPEAT_COUNT" in
            ''|*[!0-9]*)
              echo "smoke_repeat_count must be an integer from 1 to 10" >&2
              exit 2
              ;;
          esac
          if [[ "$SMOKE_REPEAT_COUNT" -lt 1 || "$SMOKE_REPEAT_COUNT" -gt 10 ]]; then
            echo "smoke_repeat_count must be between 1 and 10" >&2
            exit 2
          fi
          output="$GITHUB_WORKSPACE/Builds/PlayerSmoke/$PLAYER_PLATFORM"
          if [[ "$SMOKE_REPEAT_COUNT" == "1" ]]; then
            python tools/run-player-smoke.py \
              --platform "$PLAYER_PLATFORM" \
              --archive "player-artifacts/$PLAYER_PLATFORM.zip" \
              --source "$GITHUB_SHA" \
              --pr-head "$PR_HEAD_SHA" \
              --output "$output"
          else
            python tools/run-player-smoke-repeat.py \
              --platform "$PLAYER_PLATFORM" \
              --archive "player-artifacts/$PLAYER_PLATFORM.zip" \
              --source "$GITHUB_SHA" \
              --pr-head "$PR_HEAD_SHA" \
              --output "$output" \
              --repeat "$SMOKE_REPEAT_COUNT" \
              --require-quit-marker
          fi
      - name: Preserve native runtime logs and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: Builds/PlayerSmoke/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 30
