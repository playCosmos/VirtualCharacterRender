name: U3 Alpha/P11 native Windows IL2CPP verification
# Native Windows nondevelopment proof, not release or physical acceptance.
on:
  push:
    branches:
      - feature/u3-toolkit-only-retirement-20261119
    paths:
      - .github/workflows/u3-alpha-p11-windows-il2cpp.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: u3-alpha-p11-il2cpp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-il2cpp:
    name: Build and run independent Alpha/P11 Windows IL2CPP Players
    runs-on: windows-2022
    timeout-minutes: 190
    steps:
      - name: Checkout exact U3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned editor, source and settings fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/u3-toolkit-only-retirement-20261119'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          python tools/validate-unity-reproducibility.py
          python tools/validate-repository-structure.py --strict-reproducibility
          test ! -e unity/Library
          sha256sum unity/Packages/packages-lock.json unity/ProjectSettings/ProjectSettings.asset > "$RUNNER_TEMP/u3-il2cpp-input.sha256"
          find tools -maxdepth 1 -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'
      - name: Use pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression-test IL2CPP payload ordering and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify-u3-il2cpp-payload.py --self-test
      - name: Supply python3 to verified bash bootstraps
        shell: bash
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/u3-shims"
          mkdir -p "$shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim/python3"
          chmod +x "$shim/python3"
          printf '%s\n' "$(cygpath -w "$shim")" >> "$GITHUB_PATH"
          "$shim/python3" --version
      - name: Bootstrap pinned Unity dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bootstrap-mediapipe.sh
          bash tools/bootstrap-ui-fonts.sh
          bash tools/bootstrap-ultraleap.sh
          bash tools/bootstrap-uniwinc.sh
      - name: Require native Windows Docker engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $service = Get-Service docker -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq 'Stopped') {
              Start-Service docker -ErrorAction SilentlyContinue
            }
            docker version 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 6
          }
          throw 'Windows Docker engine unavailable'
      - name: Pull pinned Unity Windows IL2CPP Editor image
        shell: powershell
        timeout-minutes: 30
        run: |
          $image = 'unityci/editor:windows-6000.3.25f1-windows-il2cpp-3'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            docker pull $image
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          throw "Pinned Windows IL2CPP Editor unavailable: $image"
      - name: Build actual Alpha and P11 nondevelopment IL2CPP Players
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneWindows64
          buildMethod: VCR.Editor.Alpha.U3AlphaP11PlayerBuild.BuildWindowsIl2CppAndExit
          customImage: unityci/editor:windows-6000.3.25f1-windows-il2cpp-3
          manualExit: true
          versioning: None
          allowDirtyBuild: true
      - name: Restore pinned PlayerSettings and require unchanged inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- unity/ProjectSettings/ProjectSettings.asset; then
            git diff -- unity/ProjectSettings/ProjectSettings.asset
            git restore --source=HEAD -- unity/ProjectSettings/ProjectSettings.asset
          fi
          sha256sum --check "$RUNNER_TEMP/u3-il2cpp-input.sha256"
      - name: Package actual AOT binaries with independent complete manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          for variant in ("Alpha", "P11"):
              root = Path("unity/Builds/U3") / variant / "Windows-IL2CPP"
              required = ("VirtualCharacterRender.exe", "UnityPlayer.dll",
                          "GameAssembly.dll",
                          "VirtualCharacterRender_Data/il2cpp_data/Metadata/global-metadata.dat")
              for name in required:
                  file = root / name
                  if not file.is_file() or file.stat().st_size == 0:
                      raise SystemExit(variant + ": required IL2CPP binary missing: " + name)
              if (root / "MonoBleedingEdge").exists():
                  raise SystemExit(variant + ": Mono runtime wrongly included")
              target = Path("u3-il2cpp-artifacts") / variant
              target.mkdir(parents=True, exist_ok=True)
              archive = target / "windows.zip"
              entries = []
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=1) as packed:
                  for file in sorted(root.rglob("*")):
                      if not file.is_file():
                          continue
                      relative = file.relative_to(root).as_posix()
                      packed.write(file, relative)
                      digest = hashlib.sha256()
                      with file.open("rb") as source:
                          for block in iter(lambda: source.read(1024 * 1024), b""):
                              digest.update(block)
                      entries.append({"path": relative, "bytes": file.stat().st_size,
                                      "sha256": digest.hexdigest()})
              digest = hashlib.sha256()
              with archive.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(block)
              (target / "windows.sha256").write_text(
                  digest.hexdigest() + "  windows.zip\n", encoding="utf-8")
              (target / "windows.source-sha").write_text(
                  os.environ["GITHUB_SHA"] + "\n", encoding="utf-8")
              (target / "windows.payload-sha256.json").write_text(
                  json.dumps({"format": "vcr-u3-il2cpp-payload-v1",
                              "variant": variant, "sourceSha": os.environ["GITHUB_SHA"],
                              "files": entries}, indent=2) + "\n", encoding="utf-8")
              print(variant + ": independent IL2CPP archive SHA-256: " + digest.hexdigest())
          PY
      - name: Verify complete native build payload equals both ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify-u3-il2cpp-payload.py \
            --root unity/Builds/U3 \
            --artifacts u3-il2cpp-artifacts \
            --source "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/u3-il2cpp-input.sha256"
      - name: Run both real nondevelopment Windows IL2CPP Players
        shell: bash
        run: |
          set -euo pipefail
          for variant in Alpha P11; do
            python tools/run-player-smoke.py \
              --platform windows-nodebug \
              --archive "u3-il2cpp-artifacts/$variant/windows.zip" \
              --source "$GITHUB_SHA" \
              --output "Builds/PlayerSmoke/U3/$variant-Windows-IL2CPP"
          done
      - name: Observe real Alpha/P11 Windows IL2CPP GUI and WM_CLOSE
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          python -m py_compile tools/probe-u3-windows-gui.py
          python tools/probe-u3-windows-gui.py --self-test
          for variant in Alpha P11; do
            python tools/probe-u3-windows-gui.py \
              --variant "$variant" \
              --archive "u3-il2cpp-artifacts/$variant/windows.zip" \
              --source "$GITHUB_SHA" \
              --screen-width 960 --screen-height 520 \
              --output "Builds/GUIProbe/U3/$variant-Windows-IL2CPP"
          done
      - name: Require exact-source real window and managed quit for both
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for variant in ("Alpha", "P11"):
              path = Path("Builds/GUIProbe/U3") / (variant + "-Windows-IL2CPP") / "u3-gui-probe.json"
              report = json.loads(path.read_text(encoding="utf-8"))
              required = ("windowObserved", "workspaceUiTreeReady", "nativeFramePassed",
                          "freeResizePassed", "opaqueWindowConfigPassed",
                          "unityFrameDiverse", "runtimeExceptionFree",
                          "managedQuitObserved", "passed")
              if (report.get("variant") != variant or
                      report.get("sourceSha") != os.environ["GITHUB_SHA"] or
                      not all(report.get(key) is True for key in required) or
                      report.get("exitCode") != 0):
                  raise SystemExit(variant + ": real source-bound IL2CPP GUI evidence failed")
              print(variant + ": real Windows IL2CPP HWND/UIToolkit/quit PASS")
          PY
      - name: Preserve diagnostic AOT binaries and Windows native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u3-alpha-p11-il2cpp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            u3-il2cpp-artifacts/
            Builds/PlayerSmoke/U3/
            Builds/GUIProbe/U3/
          if-no-files-found: warn
          retention-days: 7
