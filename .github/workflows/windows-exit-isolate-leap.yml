# Differential control for A: identical minimal scene, same Unity/version,
# only eager Ultraleap hint-controller creation is skipped in CI workspace.
# Normal A/B/C/D/production bootstraps remain unchanged; no release/tag.
name: Windows native shutdown E - no eager LeapC

on:
  push:
    branches: [fix/quit-visible-window-latency]
    paths:
      - .github/workflows/windows-exit-isolate-leap.yml
      - tools/prepare-exit-comparison-e.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exit-comparison-e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-e:
    name: Build Windows E - A scene without eager LeapC
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert immutable Unity configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          python3 tools/validate-unity-reproducibility.py
          sha256sum unity/Packages/packages-lock.json unity/ProjectSettings/ProjectSettings.asset > "$RUNNER_TEMP/project-inputs.sha256"
          test ! -e unity/Library
      - name: Bootstrap unchanged pinned runtime packages
        run: |
          set -euo pipefail
          bash tools/bootstrap-mediapipe.sh
          bash tools/bootstrap-ui-fonts.sh
          bash tools/bootstrap-ultraleap.sh
          bash tools/bootstrap-uniwinc.sh
      - name: Apply E-only differential to eager Ultraleap hint initializer
        run: python3 tools/prepare-exit-comparison-e.py
      - name: Build same A Unity scene under BuildOptions.None
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneWindows64
          buildMethod: VCR.Editor.Alpha.ExitComparisonBuildMenu.BuildWindowsA
          versioning: None
          allowDirtyBuild: true
      - name: Archive verified differential Player and provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/project-inputs.sha256"
          folder="Builds/ExitComparison/A"
          test -s "$folder/VirtualCharacterRender.exe"
          test -d "$folder/VirtualCharacterRender_Data"
          mkdir -p exit-comparison-e
          archive="$GITHUB_WORKSPACE/exit-comparison-e/vcr-exit-compare-E-no-eager-leap.zip"
          (cd "$folder" && zip -q -r -y "$archive" .)
          printf '{"variant":"E","scene":"A","source":"%s","unity":"6000.3.25f1","buildOptions":"None","onlyDifferential":"skip empty startup hint native LeapC connection"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/comparison-variant.json"
          zip -q -j "$archive" "$RUNNER_TEMP/comparison-variant.json" \
            tools/start-exit-diagnostics.cmd \
            tools/collect-exit-diagnostics.ps1 \
            tools/start-exit-diagnostics-native.cmd \
            tools/capture-exit-dump.ps1
          sha256sum "$archive" > exit-comparison-e/vcr-exit-compare-E.sha256
          printf '%s\n' "$GITHUB_SHA" > exit-comparison-e/source-sha.txt
      - name: Upload E standalone Windows comparison
        uses: actions/upload-artifact@v4
        with:
          name: windows-exit-compare-E-no-eager-leap-${{ github.sha }}
          path: exit-comparison-e/
          if-no-files-found: error
          retention-days: 14
