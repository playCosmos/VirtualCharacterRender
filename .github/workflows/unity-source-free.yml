name: Unity P0-P13 source-free validation

on:
  push:
    branches:
      - develop
      - ci/unity-p0-p13-source-free
      # U1 must compile in Unity, not just pass repository lint.
      - feature/obs-ui-u1-layout-contract-20261026
  pull_request:
    branches:
      - develop
      # Stacked M2 PR validates its exact source on the M1 integration base.
      - feature/commercial-readiness-phase1
      # Stacked M3 PR validates its runtime/network fix against M2.
      - feature/commercial-readiness-m2-evidence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-source-free-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unity-source-free:
    name: P0-P13 inherited Unity Editor checks
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pinned Unity project and store input fingerprints
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          python3 tools/validate-unity-reproducibility.py
          python3 tools/validate-repository-structure.py --strict-reproducibility
          sha256sum unity/Packages/packages-lock.json unity/ProjectSettings/ProjectSettings.asset > "$RUNNER_TEMP/unity-reproducibility.sha256"
          test ! -e unity/Library

      - name: Bootstrap SHA-verified MediaPipe and models
        run: bash tools/bootstrap-mediapipe.sh
      - name: Bootstrap verified Pretendard UI font
        run: bash tools/bootstrap-ui-fonts.sh
      - name: Bootstrap pinned Ultraleap Unity 6 compatibility
        run: bash tools/bootstrap-ultraleap.sh
      - name: Bootstrap pinned UniWinC teardown compatibility
        run: bash tools/bootstrap-uniwinc.sh

      - name: Run Unity 6000.3.25f1 P0-P13 source-free validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneWindows64
          buildMethod: VCR.Editor.P13.P13BatchValidation.RunSourceFreeAndExit
          # Editor-only checks do not build a Player. Use the Ubuntu-hosted
          # Windows Mono image; Windows IL2CPP requires a Windows host.
          customImage: unityci/editor:6000.3.25f1-windows-mono-3
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Generate and validate P1 UI Toolkit workspace
        if: github.ref == 'refs/heads/feature/obs-ui-u1-layout-contract-20261026'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneWindows64
          buildMethod: VCR.Editor.P1.P1BatchValidation.GenerateWorkspaceAndExit
          customImage: unityci/editor:6000.3.25f1-windows-mono-3
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Require generated P1 workspace assets
        if: github.ref == 'refs/heads/feature/obs-ui-u1-layout-contract-20261026'
        shell: bash
        run: |
          set -euo pipefail
          test -s unity/Assets/VCR/P1/P1Runtime.unity
          test -s unity/Assets/VCR/P1/WorkspacePanelSettings.asset
          sha256sum --check "$RUNNER_TEMP/unity-reproducibility.sha256"
          echo "P1 UI Toolkit workspace generation: PASS"

      - name: Build P1 Windows development player
        if: github.ref == 'refs/heads/feature/obs-ui-u1-layout-contract-20261026'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneWindows64
          buildMethod: VCR.Editor.P1.P1BatchValidation.BuildWindowsDevelopmentAndExit
          customImage: unityci/editor:6000.3.25f1-windows-mono-3
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Require P1 Windows player output
        if: github.ref == 'refs/heads/feature/obs-ui-u1-layout-contract-20261026'
        shell: bash
        run: |
          set -euo pipefail
          test -s unity/Builds/P1/Windows-Development/VirtualCharacterRender.exe
          test -d unity/Builds/P1/Windows-Development/VirtualCharacterRender_Data
          sha256sum --check "$RUNNER_TEMP/unity-reproducibility.sha256"
          echo "P1 Windows development player: PASS"

      - name: Archive P1 Windows development player
        if: github.ref == 'refs/heads/feature/obs-ui-u1-layout-contract-20261026'
        uses: actions/upload-artifact@v4
        with:
          name: p1-windows-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: unity/Builds/P1/Windows-Development/
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnose Unity package lock drift
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- unity/Packages/packages-lock.json; then
            echo "::warning::Unity rewrote packages-lock.json; inspect the patch artifact before updating the pinned lock."
            git diff -- unity/Packages/packages-lock.json | tee "$RUNNER_TEMP/unity-package-lock-diff.patch"
          fi

      - name: Require actual PASS report and unchanged lock/settings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify-unity-source-free-report.py Builds/Validation/p0-p13-source-free.json
          sha256sum --check "$RUNNER_TEMP/unity-reproducibility.sha256"
          echo "Unity P0-P13 source-free evidence: PASS for $GITHUB_SHA"

      - name: Archive Unity package lock drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-lock-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity-package-lock-diff.patch
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive source-free validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-p0-p13-${{ github.run_id }}-${{ github.run_attempt }}
          path: Builds/Validation/p0-p13-source-free.json
          if-no-files-found: warn
          retention-days: 30
