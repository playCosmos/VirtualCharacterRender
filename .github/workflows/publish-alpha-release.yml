name: Publish alpha release

on:
  push:
    branches:
      - "release/0.1.0-alpha.1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-alpha-0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.1
          TITLE: VirtualCharacterRender 0.1.0-alpha.1
        shell: bash
        run: |
          set -euo pipefail

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api               --method PATCH               "/repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"               -f sha="$GITHUB_SHA"               -F force=true               >/dev/null
          else
            gh api               --method POST               "/repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$TAG"               -f sha="$GITHUB_SHA"               >/dev/null
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## VirtualCharacterRender 0.1.0-alpha.1

          First integrated desktop alpha for runtime testing.

          This alpha keeps the current implemented feature set intact. MediaPipe webcam, ARKit/iFacialMocap, VMC receive/send, rendering/output, application UI, Appearance/outfit/accessory transitions, material overrides, events, environment, diagnostics, motion/expression, and the backend-neutral P13 2D host remain included.

          ### Prebuilt development binaries

          - Windows x64: `VirtualCharacterRender-0.1.0-alpha.1-Windows-x64.zip`
          - macOS: `VirtualCharacterRender-0.1.0-alpha.1-macOS.zip`

          Both players are Unity 6000.3.25f1 Development builds generated by the alpha binary workflow. Physical/external tracking inputs start disabled so the application can be tested without webcam or ARKit/iFacialMocap hardware first.

          ### Initial validation scope

          The first pass is intentionally equipment-free: physical webcam and ARKit/iFacialMocap evidence is deferred, but those implementations are not removed from the build. Test VRM load/reload/unload, UI, rendering/output, configuration persistence, environment transitions, material controls, Appearance/quick-change, events, diagnostics, and shutdown/relaunch before enabling physical tracking.

          Binary generation and the P0-P13 source-free validation chain are separate evidence passes. The player build itself must compile and package successfully; source-free validation failures remain visible and must be resolved independently rather than preventing creation of the alpha executable needed for runtime testing.

          ### Windows local build

          Requires Unity 6000.3.25f1 and PowerShell.

          ```powershell
          git checkout release/0.1.0-alpha.1
          ./tools/build-alpha.ps1
          ./tools/run-alpha.ps1
          ```

          With a VRM:

          ```powershell
          ./tools/run-alpha.ps1 -Vrm "C:\\models\\avatar.vrm"
          ```

          To run the independent no-hardware source-free evidence pass:

          ```powershell
          ./tools/validate-alpha-source-free.ps1
          ```

          See `docs/ALPHA_TESTING.md` for the complete first-pass checklist and deferred hardware evidence.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --target "$GITHUB_SHA"               --title "$TITLE"               --notes-file /tmp/release-notes.md               --prerelease
          else
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "$TITLE"               --notes-file /tmp/release-notes.md               --prerelease
          fi
