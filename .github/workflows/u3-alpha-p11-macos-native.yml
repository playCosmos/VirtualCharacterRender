name: U3 Alpha/P11 native macOS Player smoke

# U3-only source-bound nondevelopment macOS Mono integration.
# No release, PR merge, code signing, or physical acceptance.
on:
  push:
    branches:
      - feature/u3-toolkit-only-retirement-20261119
    paths:
      - .github/workflows/u3-alpha-p11-macos-native.yml
      - unity/Assets/VCR/Editor/Alpha/**
      - unity/Assets/VCR/Editor/P11/**
      - unity/Assets/VCR/Runtime/UI/**
      - unity/Assets/VCR/Runtime/Application/**
      - unity/Assets/VCR/Runtime/Output/**
      - unity/Assets/VCR/Runtime/Scene/**
      - native/macos/**
      - tools/run-player-smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u3-alpha-p11-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appkit:
    name: Compile source-matched arm64 AppKit Settings
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Compile and verify AppKit exports
        run: bash tools/build-native-settings-macos.sh
      - name: Package verified native Settings and Unity importer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/select-p1-macos-appkit-artifact.py --package \
            --binary unity/Assets/Plugins/macOS/VcrSettingsWindow.dylib \
            --meta native/macos/VcrSettingsWindow.dylib.meta \
            --source "$GITHUB_SHA" --output u3-appkit-artifact
      - name: Upload exact-source native Settings plugin
        uses: actions/upload-artifact@v4
        with:
          # Reuse the existing strict same-run selector's recognized prefix.
          name: p1-macos-appkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: u3-appkit-artifact/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build independent Alpha and P11 macOS Mono Players
    needs: appkit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact U3 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require pinned Unity and record source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx 'm_EditorVersion: 6000.3.25f1' unity/ProjectSettings/ProjectVersion.txt
          python3 tools/validate-unity-reproducibility.py
          python3 tools/validate-repository-structure.py --strict-reproducibility
          test ! -e unity/Library
          sha256sum unity/Packages/packages-lock.json unity/ProjectSettings/ProjectSettings.asset > "$RUNNER_TEMP/u3-macos-input.sha256"
      - name: Reclaim unused Ubuntu SDK space
        shell: bash
        run: |
          set -euo pipefail
          for sdk in /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -d "$sdk" ]; then sudo rm -rf -- "$sdk"; fi
          done
          command -v dotnet
          test -n "$(dotnet --list-sdks)"
          df -h "$GITHUB_WORKSPACE"
      - name: Bootstrap verified Unity runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bootstrap-mediapipe.sh
          bash tools/bootstrap-ui-fonts.sh
          bash tools/bootstrap-ultraleap.sh
          bash tools/bootstrap-uniwinc.sh
      - name: Download source-bound AppKit plugin attempts
        uses: actions/download-artifact@v4
        with:
          pattern: p1-macos-appkit-${{ github.run_id }}-*
          path: u3-appkit-downloads/
          merge-multiple: false
      - name: Restore source-verified native Settings plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/select-p1-macos-appkit-artifact.py --select \
            --downloads u3-appkit-downloads \
            --output unity/Assets/Plugins/macOS \
            --expected-meta native/macos/VcrSettingsWindow.dylib.meta \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --source "$GITHUB_SHA"
      - name: Build actual independent U3 nondevelopment macOS Players
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.25f1
          targetPlatform: StandaloneOSX
          buildMethod: VCR.Editor.Alpha.U3AlphaP11PlayerBuild.BuildMacMonoAndExit
          customImage: unityci/editor:6000.3.25f1-mac-mono-3
          manualExit: true
          versioning: None
          allowDirtyBuild: true
      - name: Restore pinned IL2CPP settings and verify fingerprints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- unity/ProjectSettings/ProjectSettings.asset; then
            git diff -- unity/ProjectSettings/ProjectSettings.asset
            git restore --source=HEAD -- unity/ProjectSettings/ProjectSettings.asset
          fi
          sha256sum --check "$RUNNER_TEMP/u3-macos-input.sha256"
      - name: Require both native macOS app bundles and AppKit dylib
        shell: bash
        run: |
          set -euo pipefail
          for variant in Alpha P11; do
            bundle="unity/Builds/U3/$variant/macOS/VirtualCharacterRender.app"
            test -s "$bundle/Contents/Info.plist"
            test -s "$bundle/Contents/PlugIns/VcrSettingsWindow.dylib"
          done
          sha256sum --check "$RUNNER_TEMP/u3-macos-input.sha256"
      - name: Package both native apps with independent source and SHA-256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import plistlib
          import subprocess

          for variant in ("Alpha", "P11"):
              folder = Path("unity/Builds/U3") / variant / "macOS"
              app = folder / "VirtualCharacterRender.app"
              with (app / "Contents/Info.plist").open("rb") as handle:
                  executable = plistlib.load(handle).get("CFBundleExecutable")
              if (not isinstance(executable, str) or
                      executable in ("", ".", "..") or
                      any(c in executable for c in ("/", "\\", ":", "\x00"))):
                  raise SystemExit("Unsafe U3 native app executable name")
              binary = app / "Contents/MacOS" / executable
              bridge = app / "Contents/PlugIns/VcrSettingsWindow.dylib"
              if not binary.is_file() or binary.stat().st_size == 0 or not bridge.is_file():
                  raise SystemExit("Missing U3 " + variant + " macOS native binary/bridge")
              target = Path("u3-macos-player-artifacts") / variant
              target.mkdir(parents=True, exist_ok=True)
              archive = target / "macos.zip"
              subprocess.run(["zip", "-q", "-r", "-y", str(archive.resolve()), app.name],
                             cwd=folder, check=True)
              digest = hashlib.sha256()
              with archive.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              (target / "macos.sha256").write_text(
                  digest.hexdigest() + "  macos.zip\n", encoding="utf-8")
              (target / "macos.source-sha").write_text(
                  os.environ["GITHUB_SHA"] + "\n", encoding="utf-8")
              print(variant, "macOS native Player SHA-256:", digest.hexdigest())
          PY
      - name: Upload exact-source native Alpha and P11 Player pair
        uses: actions/upload-artifact@v4
        with:
          name: u3-macos-players-${{ github.run_id }}-${{ github.run_attempt }}
          path: u3-macos-player-artifacts/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Execute real macOS Alpha/P11 Players with AppKit interop
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Download same-run native Player build attempts
        uses: actions/download-artifact@v4
        with:
          pattern: u3-macos-players-${{ github.run_id }}-*
          path: u3-macos-player-downloads/
          merge-multiple: false
      - name: Select newest complete source-bound pair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil

          parent = Path("u3-macos-player-downloads")
          prefix = "u3-macos-players-" + os.environ["GITHUB_RUN_ID"] + "-"
          max_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          candidates = []
          for directory in parent.iterdir():
              if directory.is_symlink() or not directory.is_dir() or not directory.name.startswith(prefix):
                  continue
              attempt = directory.name[len(prefix):]
              if attempt.isdecimal() and 1 <= int(attempt) <= max_attempt:
                  candidates.append((int(attempt), directory))
          # A corrupt newer artifact is a failure, not permission to test
          # a different earlier build. Reuse earlier only when none is uploaded.
          if not candidates:
              raise SystemExit("No same-run U3 macOS Player artifacts")
          attempt, chosen = max(candidates)
          for variant in ("Alpha", "P11"):
              folder = chosen / variant
              archive = folder / "macos.zip"
              digest = folder / "macos.sha256"
              source = folder / "macos.source-sha"
              if not (archive.is_file() and digest.is_file() and source.is_file()):
                  raise SystemExit("Missing U3 macOS artifact: " + variant)
              if source.read_text().strip() != os.environ["GITHUB_SHA"]:
                  raise SystemExit("Incorrect U3 macOS source SHA: " + variant)
              recorded = digest.read_text().split()
              if len(recorded) != 2 or recorded[1] != "macos.zip":
                  raise SystemExit("Invalid U3 macOS SHA-256 sidecar: " + variant)
              hasher = hashlib.sha256()
              with archive.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(block)
              if recorded[0].lower() != hasher.hexdigest():
                  raise SystemExit("Corrupt U3 macOS archive: " + variant)
          shutil.copytree(chosen, "u3-macos-player-artifacts")
          print("Selected exact-source U3 native pair from attempt", attempt)
          PY
      - name: Use pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute real Alpha macOS Player startup/recovery/quit
        shell: bash
        env:
          VCR_SMOKE_NATIVE_SETTINGS: '1'
        run: |
          set -euo pipefail
          python3 tools/run-player-smoke.py \
            --platform macos-nodebug \
            --archive u3-macos-player-artifacts/Alpha/macos.zip \
            --source "$GITHUB_SHA" --require-quit-marker \
            --output Builds/PlayerSmoke/U3/Alpha-macOS
      - name: Execute real P11 macOS Player startup/recovery/quit
        shell: bash
        env:
          VCR_SMOKE_NATIVE_SETTINGS: '1'
        run: |
          set -euo pipefail
          python3 tools/run-player-smoke.py \
            --platform macos-nodebug \
            --archive u3-macos-player-artifacts/P11/macos.zip \
            --source "$GITHUB_SHA" --require-quit-marker \
            --output Builds/PlayerSmoke/U3/P11-macOS
      - name: Require managed/native AppKit evidence in all sixteen reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for variant in ("Alpha", "P11"):
              folder = Path("Builds/PlayerSmoke/U3") / (variant + "-macOS")
              reports = sorted(folder.glob("*player-smoke.json"))
              if len(reports) != 8:
                  raise SystemExit(variant + ": expected 8 actual macOS Player reports")
              for report in reports:
                  r = json.loads(report.read_text(encoding="utf-8"))
                  if (r.get("nativeSettingsInteropPassed") is not True or
                      r.get("developmentBuild") is not False or
                      r.get("platform") != "OSXPlayer" or
                      r.get("passed") is not True):
                      raise SystemExit(variant + ": missing native AppKit PASS in " + report.name)
              print(variant + ": eight real macOS Player launches and AppKit interop PASS")
          PY
      - name: Preserve source-verified native macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u3-macos-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Builds/PlayerSmoke/U3/
            u3-macos-player-artifacts/Alpha/macos.sha256
            u3-macos-player-artifacts/Alpha/macos.source-sha
            u3-macos-player-artifacts/P11/macos.sha256
            u3-macos-player-artifacts/P11/macos.source-sha
          if-no-files-found: warn
          retention-days: 30
